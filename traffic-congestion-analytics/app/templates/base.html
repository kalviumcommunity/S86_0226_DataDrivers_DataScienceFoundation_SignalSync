<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SignalSync - Traffic Congestion Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-container">
                    <i class="fas fa-traffic-light logo-icon"></i>
                    <div class="logo-text">
                        <h1 class="logo">SignalSync</h1>
                        <p class="logo-subtitle">by team data drivers</p>
                    </div>
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                        <i class="fas fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">
                        <i class="fas fa-chart-bar"></i>
                        <span>Analytics</span>
                    </a>
                    <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                    </a>
                    <a href="/documentation"
                        class="nav-link {% if request.path == '/documentation' %}active{% endif %}">
                        <i class="fas fa-book"></i>
                        <span>Documentation</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">
                    <i class="fas fa-copyright"></i> 2024 SignalSync - by team data drivers
                </p>
                <p class="footer-tech">
                    <i class="fab fa-python"></i> Python |
                    <i class="fas fa-flask"></i> Flask |
                    <i class="fas fa-brain"></i> Machine Learning
                </p>
            </div>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>

</html>
